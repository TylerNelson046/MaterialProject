# LightGBM training config (Phase 3).
# Paths are relative to the project root unless absolute.

export:
  # Frozen training package produced by scripts/export_training_package.py
  dir: data/processed/training_exports
  targets_subdir: targets
  splits_file: splits.parquet

output:
  models_dir: data/models
  # Per-run layout: data/models/<target>/<target>_<utc>/

features:
  # Must match columns written into training_exports target parquets.
  use_frac_elements: true          # frac_H … frac_Og (Z=1–118)
  use_composition_stats: true      # comp_mean_atomic_number, …
  # Extra weighted elemental descriptors derived from formula_pretty at train/predict time.
  use_element_descriptors: true
  # Extra numeric columns from the export tables (optional; empty = none).
  extra_cols: []

splits:
  column: split
  train_value: train
  val_value: val
  test_value: test

training:
  seed: 42
  # Train these by default with --all-ready / when no --target is given.
  default_tier: Ready
  # Stop when val loss stops improving (n_estimators is an upper cap).
  early_stopping_rounds: 80
  # Shared LightGBM baseline; per-target blocks below override keys as needed.
  lightgbm:
    n_estimators: 4000
    learning_rate: 0.03
    num_leaves: 96
    min_child_samples: 30
    subsample: 0.85
    colsample_bytree: 0.85
    reg_alpha: 0.0
    reg_lambda: 1.0
    random_state: 42
    n_jobs: -1
    verbose: -1

# Target heads. label_col in each parquet is always "label".
# Ready: primary Phase 3 scope. Niche: train after Ready baselines look sane.
# transform: optional label map in model space (metrics reported in original units).
targets:
  energy_above_hull:
    tier: Ready
    parquet: energy_above_hull.parquet
    label_col: label
    transform: log1p
    lightgbm:
      learning_rate: 0.02
      num_leaves: 127
      min_child_samples: 20
      reg_lambda: 2.0

  formation_energy_per_atom:
    tier: Ready
    parquet: formation_energy_per_atom.parquet
    label_col: label
    lightgbm:
      learning_rate: 0.03
      num_leaves: 127
      min_child_samples: 25

  band_gap:
    tier: Ready
    parquet: band_gap.parquet
    label_col: label
    transform: log1p
    lightgbm:
      learning_rate: 0.02
      num_leaves: 127
      min_child_samples: 25
      reg_lambda: 1.5

  density:
    tier: Ready
    parquet: density.parquet
    label_col: label
    lightgbm:
      learning_rate: 0.03
      num_leaves: 96
      min_child_samples: 20

  bulk_modulus_vrh:
    tier: Niche
    parquet: bulk_modulus_vrh.parquet
    label_col: label
    transform: log1p
    lightgbm:
      learning_rate: 0.03
      num_leaves: 127
      min_child_samples: 15
      reg_lambda: 1.0

  # Ablation: identity labels beat log1p for shear on this export.
  shear_modulus_vrh:
    tier: Niche
    parquet: shear_modulus_vrh.parquet
    label_col: label
    lightgbm:
      learning_rate: 0.03
      num_leaves: 127
      min_child_samples: 15
      reg_lambda: 1.0

  # Small AGL thermal set (~4.4k train): lighter trees, stronger regularization.
  thermal_conductivity_agl:
    tier: Niche
    parquet: thermal_conductivity_agl.parquet
    label_col: label
    transform: log1p
    lightgbm:
      learning_rate: 0.04
      num_leaves: 47
      min_child_samples: 15
      subsample: 0.9
      colsample_bytree: 0.9
      reg_lambda: 2.5

  debye_temperature:
    tier: Niche
    parquet: debye_temperature.parquet
    label_col: label
    transform: log1p
    lightgbm:
      learning_rate: 0.04
      num_leaves: 63
      min_child_samples: 10
      subsample: 0.9
      colsample_bytree: 0.9
      reg_lambda: 1.5

  heat_capacity_cv:
    tier: Niche
    parquet: heat_capacity_cv.parquet
    label_col: label
    transform: log1p
    lightgbm:
      learning_rate: 0.05
      num_leaves: 63
      min_child_samples: 10
      subsample: 0.9
      colsample_bytree: 0.9
      reg_lambda: 1.0

  # Ablation: identity labels beat log1p for battery capacity on this export.
  battery_capacity_grav:
    tier: Niche
    parquet: battery_capacity_grav.parquet
    label_col: label
    lightgbm:
      learning_rate: 0.03
      num_leaves: 96
      min_child_samples: 15
      reg_lambda: 1.0
