[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-predictor"
version = "0.1.0"
description = "Materials data collection, training exports, LightGBM models, and optional MACE"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Materials Predictor Contributors" }]
dependencies = [
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "duckdb>=1.0",
    "mp-api>=0.41",
    "pymatgen>=2024.1",
    "jarvis-tools>=2024.1",
    "requests>=2.31",
    "deltalake>=0.15",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]
# Structure / MACE stack (Phase 4+). Does not alter the default LightGBM install.
# Install torch from pytorch.org first if you need a specific CUDA build, then:
#   pip install -e ".[mace]"
# Known-good notes: docs/mace_training.md
mace = [
    "torch>=2.2",
    "ase>=3.22",
    "mace-torch>=0.3.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
